[alembic]
script_location = alembic
# NOTE: sqlalchemy.url is intentionally NOT set here.
# alembic/env.py reads the URL from app settings (DATABASE_URL) so CLI and app
# can never disagree. Override per-run with: alembic -x db_url=<URL> <cmd>

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
